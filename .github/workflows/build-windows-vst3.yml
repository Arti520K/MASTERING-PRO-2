
name: Build MASTERING PRO 2 VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows-vst3.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target MASTERING_PRO_2_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Filter "*.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) {
            throw "VST3 plugin folder was not found."
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath "MASTERING-PRO-2-VST3-Windows.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASTERING-PRO-2-VST3-Windows
          path: MASTERING-PRO-2-VST3-Windows.zip
